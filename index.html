{id:'a1-1',level:'A1',title:'Labas! Greetings',vi:'Chào hỏi và giới thiệu',en:'Greetings and introductions',vocab:[['Labas','Xin chào','Hello'],['Ačiū','Cảm ơn','Thank you'],['Taip','Có','Yes'],['Ne','Không','No']],grammar:{vi:'Labas là lời chào thân mật. Laba diena là lời chào lịch sự vào ban ngày. Ačiū dùng để cảm ơn.',en:'Labas is an informal greeting. Laba diena is a polite daytime greeting. Ačiū means thank you.'},qs:[{type:'choice',prompt:'“Xin chào” trong tiếng Lithuania?',en:'How do you say “Hello” in Lithuanian?',options:['Labas','Ačiū','Ne','Taip'],answer:'Labas'},{type:'tiles',prompt:'Sắp xếp thành câu: Cảm ơn!',en:'Build the sentence: Thank you!',options:['Ačiū','Labas','Taip'],answer:'Ačiū'},{type:'write',prompt:'Viết “Có” bằng tiếng Lithuania',en:'Write “Yes” in Lithuanian',answer:'Taip'},{type:'listen',prompt:'Nghe và viết lại từ được đọc',en:'Listen and type the word you hear',answer:'Labas'}]},
{id:'a1-2',level:'A1',title:'My name is…',vi:'Giới thiệu tên',en:'Introducing yourself',vocab:[['Aš','Tôi','I'],['Mano','Của tôi','My'],['vardas','Tên','Name'],['Esu','Tôi là','I am']],grammar:{vi:'Mano vardas... nghĩa là “Tên tôi là...”. Aš esu... nghĩa là “Tôi là...”. Trong câu đơn giản, đại từ Aš đôi khi có thể lược bỏ.',en:'Mano vardas... means “My name is...”. Aš esu... means “I am...”. The pronoun Aš can sometimes be omitted.'},qs:[{type:'choice',prompt:'“Mano” có nghĩa là gì?',en:'What does “Mano” mean?',options:['Của tôi','Xin chào','Có','Tên'],answer:'Của tôi'},{type:'tiles',prompt:'Sắp xếp: Tôi là',en:'Build: I am',options:['esu','Aš','vardas'],answer:'Aš esu'},{type:'write',prompt:'Viết “Tên tôi” bằng tiếng Lithuania',en:'Write “My name” in Lithuanian',answer:'Mano vardas'}]},

{id:'b1-1',level:'B1',title:'Expressing opinions',vi:'Bày tỏ quan điểm',en:'Expressing opinions',vocab:[['Manau','Tôi nghĩ','I think'],['Nes','Bởi vì','Because'],['Svarbu','Quan trọng','Important']],grammar:{vi:'Manau, kad... là cách mở đầu một ý kiến: “Tôi nghĩ rằng...”. Nes dùng để nêu lý do.',en:'Manau, kad... introduces an opinion: “I think that...”. Nes gives a reason.'},qs:[{type:'choice',prompt:'“Nes” nghĩa là gì?',en:'What does “Nes” mean?',options:['Bởi vì','Nhưng','Và','Hoặc'],answer:'Bởi vì'},{type:'write',prompt:'Viết “Tôi nghĩ” bằng tiếng Lithuania',en:'Write “I think” in Lithuanian',answer:'Manau'}]},
{id:'b2-1',level:'B2',title:'Formal discussion',vi:'Thảo luận trang trọng',en:'Formal discussion',vocab:[['Vis dėlto','Tuy nhiên','Nevertheless'],['Atsižvelgiant į','Xét đến','Considering'],['Todėl','Vì vậy','Therefore']],grammar:{vi:'Vis dėlto dùng để chuyển ý hoặc nêu sự tương phản. Todėl dùng để dẫn đến kết luận hoặc hệ quả.',en:'Vis dėlto marks contrast or concession. Todėl introduces a result or conclusion.'},qs:[{type:'choice',prompt:'“Todėl” nghĩa là gì?',en:'What does “Todėl” mean?',options:['Vì vậy','Mặc dù','Nếu','Khi'],answer:'Vì vậy'},{type:'write',prompt:'Viết “Tuy nhiên” bằng tiếng Lithuania',en:'Write “Nevertheless” in Lithuanian',answer:'Vis dėlto'}]}

{id:'a1-3',level:'A1',title:'Polite expressions',vi:'Câu nói lịch sự',en:'Polite expressions',vocab:[['Laba diena','Xin chào (lịch sự)','Good afternoon / Hello'],['Viso gero','Tạm biệt','Goodbye'],['Atsiprašau','Xin lỗi','Excuse me / Sorry'],['Prašau','Làm ơn / Xin mời','Please / Here you go']],grammar:{vi:'Laba diena dùng khi chào lịch sự. Viso gero là lời tạm biệt. Atsiprašau dùng để xin lỗi hoặc thu hút sự chú ý.',en:'Laba diena is a polite greeting. Viso gero means goodbye. Atsiprašau can be used to apologize or get attention.'},qs:[{type:'choice',prompt:'“Tạm biệt” nói thế nào?',en:'How do you say “Goodbye”?',options:['Viso gero','Taip','Ačiū','Labas'],answer:'Viso gero'},{type:'write',prompt:'Viết “Xin lỗi” bằng tiếng Lithuania',en:'Write “Sorry” in Lithuanian',answer:'Atsiprašau'},{type:'listen',prompt:'Nghe và chép lại',en:'Listen and type',answer:'Laba diena'}]},
{id:'a1-4',level:'A1',title:'Numbers 1–5',vi:'Số đếm 1–5',en:'Numbers 1–5',vocab:[['vienas','một','one'],['du','hai','two'],['trys','ba','three'],['keturi','bốn','four'],['penki','năm','five']],grammar:{vi:'Các số từ một đến năm là vienas, du, trys, keturi, penki. Đây là dạng cơ bản; số từ có thể biến đổi theo giống và cách của danh từ.',en:'The basic numbers one through five are vienas, du, trys, keturi, penki. Numerals can change with gender and grammatical case.'},qs:[{type:'choice',prompt:'“Ba” là từ nào?',en:'Which word means “three”?',options:['trys','du','penki','vienas'],answer:'trys'},{type:'write',prompt:'Viết số “năm”',en:'Write the number “five”',answer:'penki'},{type:'listen',prompt:'Nghe và chép lại',en:'Listen and type',answer:'keturi'}]},
{id:'a1-5',level:'A1',title:'Simple questions',vi:'Câu hỏi cơ bản',en:'Basic questions',vocab:[['Kas?','Ai? / Cái gì?','Who? / What?'],['Kur?','Ở đâu?','Where?'],['Kaip?','Như thế nào?','How?'],['Kada?','Khi nào?','When?']],grammar:{vi:'Từ để hỏi thường đứng đầu câu. Kur? hỏi về nơi chốn, Kada? hỏi về thời gian, Kaip? hỏi về cách thức.',en:'Question words commonly appear at the start of a question. Kur asks about place, Kada about time, and Kaip about manner.'},qs:[{type:'choice',prompt:'“Ở đâu?” nói thế nào?',en:'How do you say “Where?”',options:['Kur?','Kas?','Kada?','Kaip?'],answer:'Kur?'},{type:'write',prompt:'Viết “Khi nào?”',en:'Write “When?”',answer:'Kada?'},{type:'listen',prompt:'Nghe và chép lại',en:'Listen and type',answer:'Kaip'}]}

const storeKey='labas-lietuva-v1';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{xp:0,hearts:5,streak:0,lastDay:'',done:[],missed:[],level:'A1'}}catch{state={xp:0,hearts:5,streak:0,lastDay:'',done:[],missed:[],level:'A1'}}let page='home',active=null,idx=0,selected='',feedback=null,lang='vi';const view=document.getElementById('view');function save(){localStorage.setItem(storeKey,JSON.stringify(state));scheduleSync()}function tr(vi,en){return lang==='vi'?vi:en}
function speak(s) {
  if (!('speechSynthesis' in window)) {
    alert('Thiết bị không hỗ trợ đọc văn bản.');
    return;
  }

  const voices = speechSynthesis.getVoices();
  const ltVoice = voices.find(v =>
    v.lang.toLowerCase().replace('_', '-') === 'lt-lt'
  ) || voices.find(v =>
    v.lang.toLowerCase().startsWith('lt-')
  );

  if (!ltVoice) {
    alert(
      'Thiết bị chưa có giọng đọc tiếng Lithuania. ' +
      'Ứng dụng sẽ không sử dụng giọng ngôn ngữ khác để tránh phát âm sai.'
    );
    return;
  }

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(s);
  u.lang = 'lt-LT';
  u.voice = ltVoice;
  u.rate = 0.85;

  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function headerStats(){['xp','streak','hearts'].forEach(k=>document.getElementById(k).textContent=state[k])}function render(){headerStats();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+page));if(page==='home')home();else if(page==='lesson')lesson();else if(page==='review')review();else profile()}
function home(){view.innerHTML=`<div class="heading">${tr('Hành trình học của bạn','Your learning journey')} ✨</div><div class="card"><div class="muted">${tr('Chọn cấp độ','Choose a level')}</div><div class="levels">${['A1','A2','B1','B2'].map(l=>`<button class="level ${state.level===l?'active':''}" onclick="state.level='${l}';save();render()">${l}</button>`).join('')}</div><p class="tiny">${tr('Nội dung mẫu cho mỗi cấp độ; chương trình đầy đủ đang được phát triển.','Sample content for each level; the full curriculum is in development.')}</p></div><div class="heading">${tr('Bài học','Lessons')} · ${state.level}</div>${lessons.filter(l=>l.level===state.level).map(l=>`<button class="lesson" onclick="start('${l.id}')"><span><strong>${state.done.includes(l.id)?'✅':'📗'} ${esc(l.title)}</strong><small>${esc(lang==='vi'?l.vi:l.en)} · 10–15 min</small></span><span>❯</span></button>`).join('')}<div class="card" style="margin-top:16px"><span class="badge">🇱🇹 Real-life Lithuanian</span><p>${tr('Học từ mới, nghe phát âm và luyện câu đơn giản. Bài hội thoại tương tác sẽ được bổ sung trong các bản tiếp theo.','Learn vocabulary, hear pronunciation, and practice simple sentences. Interactive conversations are planned for later versions.')}</p></div>`}
function start(id){active=lessons.find(l=>l.id===id);idx=-1;selected='';feedback=null;page='lesson';render()}function lesson(){if(idx===-1){view.innerHTML=`<button class="action secondary" onclick="page='home';render()">← ${tr('Trở lại','Back')}</button><div class="card"><span class="badge">${active.level} · ${esc(active.title)}</span><h2>${tr('Từ vựng mới','New vocabulary')}</h2>${active.vocab.map(v=>`<div class="lesson"><div><strong>${esc(v[0])}</strong><small>${esc(lang==='vi'?v[1]:v[2])}</small></div><button class="level" onclick="speak('${v[0].replace(/'/g,"\\'")}')">🔊</button></div>`).join('')}<h3>📘 ${tr('Ngữ pháp','Grammar')}</h3><p>${esc(active.grammar[lang])}</p><button class="action" onclick="idx=0;render()">${tr('Bắt đầu luyện tập','Start practice')} →</button></div>`;return}if(idx>=active.qs.length){finish();return}let q=active.qs[idx];view.innerHTML=`<button class="action secondary" onclick="page='home';render()">✕ ${tr('Thoát bài','Exit')}</button><p class="muted">${tr('Câu','Question')} ${idx+1}/${active.qs.length}</p><div class="bar"><div style="width:${idx/active.qs.length*100}%"></div></div><div class="card" style="margin-top:18px"><div class="badge">${({choice:'Multiple choice',tiles:'Sentence building',write:'Writing',listen:'Listening'})[q.type]}</div><div class="question">${esc(lang==='vi'?q.prompt:q.en)}</div>${q.type==='listen'?`<button class="action secondary" onclick="speak('${q.answer}')">🔊 ${tr('Nghe lại','Play audio')}</button>`:''}${q.type==='choice'?q.options.map(o=>`<button class="choice ${selected===o?'selected':''}" onclick="selected=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${esc(o)}</button>`).join(''):q.type==='tiles'?`<div id="tile-answer" class="card" style="min-height:58px">${esc(selected)}</div>${q.options.map(o=>`<button class="word" onclick="selected=(selected+' ${o}').trim();render()">${esc(o)}</button>`).join('')}<button class="action secondary" onclick="selected='';render()">↺ ${tr('Làm lại','Clear')}</button>`:`<input class="input" id="answer" placeholder="${tr('Nhập câu trả lời...','Type your answer...')}" value="${esc(selected)}" oninput="selected=this.value">`}${feedback?`<div class="feedback ${feedback.ok?'':'wrong'}">${feedback.ok?'✅ '+tr('Chính xác!','Correct!'):'💡 '+tr('Đáp án đúng: ','Correct answer: ')+esc(q.answer)}</div>`:''}<button class="action" onclick="${feedback?'next()':'check()'}">${feedback?tr('Tiếp tục →','Continue →'):tr('Kiểm tra','Check')}</button></div>`}
function normalize(s){return s.toLocaleLowerCase('lt').trim().replace(/[.!?]/g,'').replace(/\s+/g,' ')}function check(){let q=active.qs[idx];if(!selected.trim())return;let ok=normalize(selected)===normalize(q.answer);feedback={ok};if(ok)state.xp+=10;else{state.hearts=Math.max(0,state.hearts-1);if(!state.missed.includes(active.id))state.missed.push(active.id)}save();render()}function next(){idx++;selected='';feedback=null;render()}function finish(){if(!state.done.includes(active.id))state.done.push(active.id);let day=new Date().toLocaleDateString('en-CA');if(state.lastDay!==day){let yesterday=new Date(Date.now()-86400000).toLocaleDateString('en-CA');state.streak=state.lastDay===yesterday?state.streak+1:1;state.lastDay=day}save();view.innerHTML=`<div class="card" style="text-align:center;padding:32px"><div style="font-size:64px">🏆</div><h1>${tr('Hoàn thành bài học!','Lesson complete!')}</h1><p>${tr('Bạn đã luyện tập thêm một bước trên hành trình học tiếng Lithuania.','You are one step closer to learning Lithuanian.')}</p><div class="badge">⚡ ${state.xp} XP</div><button class="action" onclick="page='home';render()">${tr('Về trang chủ','Back home')}</button></div>`;headerStats()}
function review(){view.innerHTML=`<div class="heading">🧠 ${tr('Ôn tập','Review')}</div><div class="card"><p>${tr('Các bài bạn từng trả lời sai sẽ xuất hiện ở đây.','Lessons with mistakes appear here.')}</p>${state.missed.length?state.missed.map(id=>{let l=lessons.find(x=>x.id===id);return l?`<button class="lesson" onclick="start('${id}')">🔁 ${esc(l.title)} →</button>`:''}).join(''):`<p class="muted">${tr('Chưa có bài cần ôn.','No missed lessons yet.')}</p>`}</div><div class="card"><h3>🗂️ Flashcards</h3>${lessons.filter(l=>state.done.includes(l.id)).flatMap(l=>l.vocab).slice(0,12).map(v=>`<button class="lesson" onclick="alert('${v[0]} — ${(lang==='vi'?v[1]:v[2]).replace(/'/g,"\\'")}')">${esc(v[0])} <span>👁</span></button>`).join('')||tr('Hoàn thành một bài để mở thẻ từ vựng.','Finish a lesson to unlock vocabulary cards.')}</div>`}function profile(){view.innerHTML=`<div class="heading">👤 ${tr('Hồ sơ học tập','Learning profile')}</div><div class="card"><h3>🏅 ${tr('Thành tích','Achievements')}</h3><p>⚡ ${state.xp} XP · 🔥 ${state.streak} ${tr('ngày','days')} · 📚 ${state.done.length} ${tr('bài','lessons')}</p><p>${state.done.length?'🥇 First Lesson Unlocked':'🔒 First Lesson'}</p></div><div class="card"><h3>☁️ ${tr('Đồng bộ tài khoản','Account sync')}</h3><p>${tr('Bản thử nghiệm hiện chỉ lưu dữ liệu trên thiết bị này. Bạn có thể cấu hình Supabase để đăng nhập email và đồng bộ.','This prototype stores data on this device only. Configure Supabase to enable email login and cloud sync.')}</p><div id="accountPanel"></div><button class="action secondary" onclick="exportData()">⬇ ${tr('Sao lưu tiến độ (JSON)','Export progress (JSON)')}</button></div><div class="card"><h3>🔊 ${tr('Kiểm tra giọng đọc','Audio check')}</h3><p>${tr('Chất lượng giọng đọc phụ thuộc vào giọng Lithuanian được cài trên thiết bị.','Audio quality depends on Lithuanian voices installed on your device.')}</p><button class="action secondary" onclick="speak('Labas, ačiū!')">🔊 Labas, ačiū!</button></div>`;renderAccount()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='labas-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
// Cloud sync is opt-in and requires config.js + database.sql. No secret service-role key in client code.
let cloud=null,cloudUser=null,syncTimer=null,syncStatus='';
function initCloud(){const c=window.LABAS_CONFIG;if(!c||!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase)return;
try{cloud=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);cloud.auth.getUser().then(({data})=>{cloudUser=data.user||null;if(cloudUser)pullCloud();if(page==='profile')render()});cloud.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;if(event==='SIGNED_IN')setTimeout(pullCloud,0);if(page==='profile')setTimeout(render,0)})}catch(e){syncStatus=e.message}}
function renderAccount(){let p=document.getElementById('accountPanel');if(!p)return;
if(!cloud){p.innerHTML='<p class="muted">'+tr('Chưa cấu hình đồng bộ. Xem hướng dẫn SETUP.md; dữ liệu vẫn lưu trên iPhone.','Cloud sync is not configured. See SETUP.md; data remains on this device.')+'</p>';return}
if(cloudUser){p.innerHTML=`<p>📧 ${esc(cloudUser.email||'')}</p><p class="muted">${esc(syncStatus)}</p><button class="action secondary" onclick="pushCloud()">☁️ ${tr('Đồng bộ ngay','Sync now')}</button><button class="action secondary" onclick="signOut()">${tr('Đăng xuất','Sign out')}</button>`;return}
p.innerHTML=`<label>Email</label><input id="authEmail" class="input" type="email" autocomplete="email" placeholder="you@example.com"><label>${tr('Mật khẩu (ít nhất 6 ký tự)','Password (at least 6 characters)')}</label><input id="authPass" class="input" type="password" autocomplete="current-password"><button class="action" onclick="authenticate(false)">${tr('Đăng nhập','Sign in')}</button><button class="action secondary" onclick="authenticate(true)">${tr('Tạo tài khoản','Create account')}</button><p class="muted">${esc(syncStatus)}</p>`}
async function authenticate(register){let email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPass')?.value;if(!email||!password)return alert(tr('Nhập email và mật khẩu','Enter email and password'));let result=register?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});syncStatus=result.error?result.error.message:(register?tr('Kiểm tra email để xác nhận tài khoản (nếu được bật).','Check your email to confirm your account (if enabled).'):tr('Đăng nhập thành công','Signed in'));render()}
async function signOut(){await cloud.auth.signOut();cloudUser=null;syncStatus='';render()}
function scheduleSync(){if(!cloudUser)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,1200)}
async function pushCloud(){if(!cloud||!cloudUser)return;const {error}=await cloud.from('learning_progress').upsert({user_id:cloudUser.id,progress:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});syncStatus=error?tr('Lỗi đồng bộ: ','Sync error: ')+error.message:tr('Đã lưu trên đám mây','Saved to cloud');if(page==='profile')render()}
async function pullCloud(){if(!cloud||!cloudUser)return;const {data,error}=await cloud.from('learning_progress').select('progress').eq('user_id',cloudUser.id).maybeSingle();if(error){syncStatus=error.message;return}if(data?.progress){const remote=data.progress;state={...state,...remote,done:[...new Set([...(state.done||[]),...(remote.done||[])])],missed:[...new Set([...(state.missed||[]),...(remote.missed||[])])],xp:Math.max(state.xp||0,remote.xp||0)};localStorage.setItem(storeKey,JSON.stringify(state));syncStatus=tr('Đã tải tiến độ từ đám mây','Loaded cloud progress');render()}else await pushCloud()}
window.addEventListener('load',initCloud);

document.getElementById('lang').onchange=e=>{lang=e.target.value;render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
